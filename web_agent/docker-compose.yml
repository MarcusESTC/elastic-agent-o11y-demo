# docker-compose.yml — Gemini AI Agent + OTel Collector
#
# Usage:
#   cp .env.example .env          # fill in your keys
#   docker compose up --build
#
# What runs:
#   gemini-agent   — Python web server (chat UI at http://localhost:5601)
#   otel-collector — Collects real container CPU/memory/net/logs → Elastic
#
# After startup, open:
#   Chat UI:  http://localhost:5601
#   APM:      https://<kb>.kb.<region>.elastic.cloud/app/apm/services/gemini-demo-agent

services:

  # ── Gemini chat agent ───────────────────────────────────────────────────────
  gemini-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gemini-demo-agent
    ports:
      - "5601:5601"
    environment:
      GEMINI_API_KEY:  "${GEMINI_API_KEY}"
      ES_ENDPOINT:     "${ES_ENDPOINT}"
      ES_API_KEY:      "${ES_API_KEY}"
      GEMINI_MODEL:    "${GEMINI_MODEL:-gemini-2.5-flash}"
      TRANSPORT:       "${TRANSPORT:-bulk}"
      PORT:            "5601"
    labels:
      # These labels help the OTel Collector identify this container
      app: "gemini-demo-agent"
      service.name: "gemini-demo-agent"
      deployment.environment: "demo"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5601/api/config')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── OTel Collector ──────────────────────────────────────────────────────────
  # Collects real Docker container metrics and logs, sends to Elastic via OTLP.
  # Data shows up in:
  #   Kibana → Observability → Infrastructure (container CPU/memory/network)
  #   Kibana → Observability → Logs (container stdout/stderr)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yaml:ro
      # Docker socket — required for docker_stats receiver
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Container logs — required for filelog receiver
      # NOTE: On macOS/Docker Desktop, container logs live inside the VM.
      # Use the alternative logging approach below if this mount is empty.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_INGEST_ENDPOINT}"
      ES_API_KEY:                  "${ES_API_KEY}"
    depends_on:
      gemini-agent:
        condition: service_healthy
    restart: unless-stopped
    # The collector itself logs to stdout; suppress noisy debug output
    logging:
      driver: "json-file"
      options:
        max-size: "5m"

networks:
  default:
    name: elastic-agent-demo
